 <form id="mitf" class="mitf"><label for="mitpw">${L("mit_pw")}</label><span class="pww"><input type="password" id="mitpw" autocomplete="current-password" required><button type="button" class="pwt" id="pwt" aria-pressed="false" aria-label="${L("mit_show")}" title="${L("mit_show")}"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 5C6.5 5 2.7 9.4 1.5 12c1.2 2.6 5 7 10.5 7s9.3-4.4 10.5-7C21.3 9.4 17.5 5 12 5zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-2.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg></button></span><button class="btn p it" type="submit">${L("mit_go")}</button><p class="note" id="mitmsg" role="status"></p></form>`;
 let cur="";const tr=MIT.fahrten.map(f=>{const d=f.d?pd(f.d):null;const o=OK[f.o];const g=d?(x=>x.charAt(0).toUpperCase()+x.slice(1))(MO()[d.getMonth()])+" "+d.getFullYear():TL(f.grp);const hd=g!==cur?`<h2 class="month">${esc(g)}</h2>`:"";cur=g;return hd+mitArt(f)}).join("");
 return `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="font-size:clamp(30px,4vw,42px);margin:16px 0 4px">${L("nav_mit")}</h2><button class="btn" id="mitout">${L("mit_out")}</button></div><p style="max-width:62ch">${esc(TL(MIT.intro))}</p><h3 style="margin:26px 0 0">${L("mit_trips")}</h3>${tr}`};
const bindMit=()=>{const t=document.getElementById("pwt");if(t)t.onclick=()=>{const i=document.getElementById("mitpw"),sh=i.type==="password";i.type=sh?"text":"password";t.setAttribute("aria-pressed",sh);const lb=L(sh?"mit_hide":"mit_show");t.title=lb;t.setAttribute("aria-label",lb);i.focus()};const f=document.getElementById("mitf");if(f)f.onsubmit=async e=>{e.preventDefault();const m=document.getElementById("mitmsg");m.textContent=L("mit_wait");const pw=document.getElementById("mitpw").value;
  try{MIT=await unlock(pw);try{sessionStorage.setItem("mitpw",pw)}catch(x){}render()}catch(x){m.textContent=L("mit_bad")}};
 const o=document.getElementById("mitout");if(o)o.onclick=()=>{MIT=null;try{sessionStorage.removeItem("mitpw")}catch(x){}render()}};
try{const pw=sessionStorage.getItem("mitpw");if(pw)unlock(pw).then(d=>{MIT=d;if(st.v==="mitglieder"||st.v.startsWith("org-"))render()}).catch(()=>{})}catch(e){}
const goMain=()=>{const v=document.getElementById("view"),b=document.querySelector(".bar"),off=document.getElementById("top").offsetHeight+(getComputedStyle(b).display==="none"||getComputedStyle(b).position!=="sticky"?0:b.offsetHeight);window.scrollTo({top:v.getBoundingClientRect().top+scrollY-off-8,behavior:"smooth"})};
const all=()=>{statics();opts();standTxt();board();stats();teaser();render()};
const setV=v=>{const wasHome=st.home;st.home=false;st.v=v;if(location.hash!=="#"+v)history.replaceState(null,"","#"+v);render();if(wasHome)window.scrollTo({top:0})};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setV(b.dataset.v));
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{LG=b.dataset.l;try{localStorage.setItem("lang",LG)}catch(e){}all()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-op]");if(!b)return;e.preventDefault();st.op=b.dataset.op;document.getElementById("op").value=st.op;setV("liste")});
document.getElementById("hr").onchange=e=>{st.hr=e.target.checked;render()};
["q","kt","tr","th","op"].forEach(id=>document.getElementById(id).addEventListener("input",e=>{st[id]=e.target.value;render()}));
const memSorted=()=>{const m=ORG.filter(o=>o.typ==="mitglied").map((o,i)=>[o,i]).sort((a,b)=>((+a[0].g||9999)-(+b[0].g||9999))||a[1]-b[1]).map(x=>x[0]);if(!m.length)return m;const d=Math.floor((Date.now()+36e5)/864e5)%m.length;return m.slice(d).concat(m.slice(0,d))};
const fromHash=()=>{const h=location.hash.slice(1);st.home=(h===""||h==="start");if(st.home)st.v="liste";if(["liste","kalender","karte","veranstalter","news","fahrzeuge","ueber","mitglieder"].includes(h)||/^(fahrt|fz|org)-/.test(h))st.v=h;render()};
document.querySelectorAll(".tlinks a,.tbrand").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();if(!ov.hidden){closeOv(true);ovHist=false}const s2=a.dataset.s;
 const v2=s2==="fahrten"?(["liste","kalender","karte","veranstalter"].includes(st.v)?st.v:"liste"):s2==="news"?"news":s2==="fz"?"fahrzeuge":s2==="mit"?"mitglieder":"ueber";
 if(a.classList.contains("tbrand")){st.v="liste";st.home=true;history.pushState(null,"",location.pathname+location.search);render();window.scrollTo({top:0,behavior:"smooth"});return}
st.home=false;st.v=v2;if(location.hash!=="#"+v2)history.pushState(null,"","#"+v2);render();window.scrollTo({top:0})}));
window.addEventListener("hashchange",fromHash);
opts();standTxt();board();stats();teaser();fromHash();
}).catch(e=>{console.error(e);document.getElementById('view').innerHTML=`<p class="empty">${L("fail")}</p>`});
}
</script>
</body>
</html>
